name: Build & Release KizShop

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore KizShop.sln

    - name: Build solution
      run: dotnet build KizShop.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test KizShop.sln --configuration Release --no-build --verbosity normal

    - name: Publish plugin & runtime dependencies
      run: dotnet publish -c Release src/KizShop/KizShop.csproj -o publish/

    - name: Package release zip
      run: |
        mkdir -p package/Plugins package/Libraries
        cp publish/KizShop.dll package/Plugins/
        find publish/ -maxdepth 1 -name "*.dll" ! -name "KizShop.dll" -exec cp {} package/Libraries/ \;
        cd package && zip -r ../KizShop-Release.zip Plugins Libraries && cd ..

    - name: Upload KizShop release artifact
      uses: actions/upload-artifact@v4
      with:
        name: KizShop-Release
        path: KizShop-Release.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: KizShop-Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
